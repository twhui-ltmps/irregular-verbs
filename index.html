<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Super Mario Verb Challenge</title>
    <!-- Google Sign-in API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google Fonts for Retro Arcade Style -->
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Sniglet:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <!--Testing comment for demo-->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="bg-symbols" id="bg-symbols"></div>
    <div id="confetti-container"></div>

    <div class="container" id="app-container">
      <!-- Menu Screen -->
      <div id="menu-screen" class="screen active">
        <h1>SUPER MARIO<br />VERB CHALLENGE</h1>

        <div class="auth-section">
          <div
            id="google-btn-container"
            style="display: flex; justify-content: center; min-height: 40px"
          ></div>
          <div
            id="user-welcome"
            style="
              display: none;
              color: var(--mario-red);
              font-weight: 800;
              font-size: 18px;
            "
          ></div>
          <p
            id="login-hint"
            style="margin: 8px 0 0; color: #636e72; font-size: 13px"
          >
            💡 Sign in with Google to save your high scores!
          </p>
        </div>

        <div class="form-group">
          <label>Select World (Level):</label>
          <select id="question-type">
            <option value="level1">
              🍄 World 1: Present Continuous (-ing)
            </option>
            <option value="level2">🔥 World 2: Past Tense (V2)</option>
            <option value="level3">⭐ World 3: Past Participle (V3)</option>
            <option value="challenge">
              👑 World 4: Bowser's Castle (Mixed)
            </option>
          </select>
        </div>

        <button class="btn" data-mode="infinite">
          ♾️ Free Play Mode
        </button>
        <button class="btn rank-btn" data-mode="timed">
          ⏱️ 3-Min Coin Dash
        </button>

        <div
          style="
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
          "
        >
          <button class="btn secondary" id="leaderboard-btn">
            🏆 Hall of Fame
          </button>
        </div>
      </div>

      <!-- Game Screen -->
      <div id="game-screen" class="screen">
        <div class="stats-bar">
          <span id="time-display" style="color: #000">TIME: 03:00</span>
          <span id="score-display" style="display: none; color: #b84418"
            >🪙 COINS: 0</span
          >
          <span id="progress-display" style="color: #00b894">✔ 0/0</span>
        </div>
        <div
          id="level-display"
          style="
            color: var(--mario-red);
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
          "
        ></div>

        <div class="target-tense" id="target-tense">Target Form</div>
        <div class="question-box" id="question-text">verb</div>

        <!-- Multiple Choice Grid -->
        <div id="choices-container" class="choices-grid">
          <!-- Choice buttons injected via JS -->
        </div>

        <button
          class="btn outline-btn"
          id="exit-btn"
          style="margin-top: 10px"
        >
          🏠 Exit World
        </button>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="screen">
        <h2>COURSE CLEAR! 🎉</h2>
        <div
          id="final-stats"
          style="
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #000;
          "
        ></div>

        <div
          id="upload-section"
          class="form-group"
          style="
            display: none;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border: 3px solid var(--mario-yellow);
          "
        >
          <label
            style="
              color: var(--mario-brick);
              text-align: center;
              font-size: 18px;
            "
            >🔥 Save High Score</label
          >

          <div
            style="
              text-align: center;
              margin-bottom: 12px;
              font-size: 16px;
              font-weight: bold;
            "
          >
            Player:
            <span
              id="upload-name-display"
              style="color: var(--mario-blue); text-decoration: underline"
            ></span>
          </div>

          <div style="display: flex; gap: 10px; margin-bottom: 10px">
            <select id="class-select" style="flex: 1">
              <option value="5A">5A</option>
              <option value="5B">5B</option>
              <option value="5C">5C</option>
              <option value="5D">5D</option>
              <option value="5E">5E</option>
            </select>
            <input
              type="number"
              id="student-num"
              placeholder="No. (1-40)"
              min="1"
              max="40"
              style="flex: 2"
            />
          </div>
          <button class="btn rank-btn" id="submit-score-btn">
            🚀 Upload Score
          </button>
        </div>

        <button class="btn secondary" data-screen="menu-screen">
          🏠 Main Menu
        </button>
      </div>

      <!-- Leaderboard Screen -->
      <div id="leaderboard-screen" class="screen">
        <h2>HALL OF FAME</h2>
        <div class="leaderboard-filters">
          <select id="filter-mode">
            <option value="timed_level1">🍄 World 1: Present Cont.</option>
            <option value="timed_level2">🔥 World 2: Past Tense</option>
            <option value="timed_level3">⭐ World 3: Past Participle</option>
            <option value="timed_challenge">👑 World 4: Bowser's Castle</option>
          </select>

          <select id="filter-class">
            <option value="ALL">🌟 All Classes</option>
            <option value="5A">5A</option>
            <option value="5B">5B</option>
            <option value="5C">5C</option>
            <option value="5D">5D</option>
            <option value="5E">5E</option>
          </select>
        </div>
        <div class="table-container">
          <table id="leaderboard-table">
            <thead>
              <tr>
                <th>RANK</th>
                <th>CLASS</th>
                <th>NO.</th>
                <th>NAME</th>
                <th>COINS</th>
                <th>ACC</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
          </table>
        </div>
        <br />
        <button class="btn secondary" data-screen="menu-screen">
          🏠 Back
        </button>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
